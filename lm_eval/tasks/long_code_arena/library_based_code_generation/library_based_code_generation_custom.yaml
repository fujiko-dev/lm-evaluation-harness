task: lca_library_based_code_generation_custom
dataset_path: json
dataset_kwargs:
  data_files: "lm_eval/tasks/long_code_arena/library_based_code_generation/sample_data.json"
unsafe_code: true
output_type: generate_until
test_split: train  # Since we're using a single file, the split doesn't matter
doc_to_text: "Instruction: {{instruction}}\n\nGenerate Python code:"
doc_to_target: "{{reference}}"
metric_list:
  - metric: !function utils.pass_at_1
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "\n\n\n\n"  # 四个换行符而不是三个，减少过早截断
    - "# End of code"  # 更明确的结束标记
  max_gen_toks: 2048  # 增加生成长度
  do_sample: true     # 启用采样
  temperature: 0.1    # 稍微增加温度
repeats: 1
num_fewshot: 0
filter_list:
  - name: "create_test"
    filter:
      - function: "custom"
        filter_fn: !function utils.build_predictions
metadata:
  version: 1.2
  description: "Library-based code generation task with adjusted generation parameters"
  paper_title: "Long Code Arena: a Set of Benchmarks for Long-Context Code Models"
  paper_url: "https://arxiv.org/abs/2406.11612"
  authors: "Egor Bogomolov, Aleksandra Eliseeva, et al."
