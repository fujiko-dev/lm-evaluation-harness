task: lca_library_based_code_generation
dataset_path: JetBrains-Research/lca-library-based-code-generation
dataset_kwargs:
  trust_remote_code: true
unsafe_code: true
output_type: generate_until
test_split: test
doc_to_text: "Instruction: {{instruction}}\n\nGenerate Python code:"
doc_to_target: "{{reference}}"
metric_list:
  - metric: !function utils.pass_at_1
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "\n\n\n"
    - "\n# "
    - "\nclass"
    - "\ndef"
  max_gen_toks: 1024
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 0
filter_list:
  - name: "create_test"
    filter:
      - function: "custom"
        filter_fn: !function utils.build_predictions
metadata:
  version: 1.0
  description: "Library-based code generation task from Long Code Arena benchmark"
  paper_title: "Long Code Arena: a Set of Benchmarks for Long-Context Code Models"
  paper_url: "https://arxiv.org/abs/2406.11612"
  authors: "Egor Bogomolov, Aleksandra Eliseeva, et al."
